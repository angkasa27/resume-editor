name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0   # sudah terbit
          npx --yes auto-changelog@2 --starting-version "$TAG" --stdout \
            | sed -n '/^#### /,$p' > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
